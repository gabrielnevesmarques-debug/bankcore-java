spring.application.name=bankcore
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankcore}
spring.datasource.username=${DB_USERNAME:bankcore}
spring.datasource.password=${DB_PASSWORD:bankcore}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
